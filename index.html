<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jivraj Tour Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #f8f9fa; --primary: #1a1a1a; --accent: #007aff; --booked: #28a745; --grey: #6c757d; }
        body { font-family: -apple-system, system-ui, sans-serif; color: var(--primary); margin: 0; background-color: var(--bg); padding-bottom: 50px; }
        .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1); }
        .header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; position: sticky; top: 0; z-index: 100; }
        
        /* WEATHER GRID */
        .weather-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; background: #f1f1f1; margin: 15px; border-radius: 16px; }
        .weather-item { background: white; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #eee; font-size: 0.8rem; font-weight: 700; }

        /* HERO SECTIONS */
        .city-hero { height: 240px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 20px; color: white; position: relative; margin: 15px; border-radius: 20px; overflow: hidden; background-color: #333; }
        .city-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .city-hero h2 { position: relative; z-index: 1; margin: 0; font-size: 1.8rem; font-weight: 800; }

        .card { background: white; border-radius: 16px; padding: 15px; border: 1px solid #eee; margin: 0 15px 20px; }
        .activity-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        .activity-item i { color: var(--accent); width: 18px; text-align: center; }

        /* PHOTO GALLERY */
        .gallery-header { padding: 10px 20px; font-weight: 800; font-size: 1.2rem; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; }
        .photo-card { background: #eee; border-radius: 12px; overflow: hidden; height: 150px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="font-weight: 900;">Jivraj Europe 2026</div>
        <div style="font-size: 0.7rem; font-weight: 800; color: var(--booked);">1 EUR = 1.48 CAD</div>
    </div>

    <div class="weather-grid" id="weather-hub">
        <div class="weather-item" id="w-lis">LIS ☀️ --°</div>
        <div class="weather-item" id="w-alg">ALG ☀️ --°</div>
        <div class="weather-item" id="w-and">AND ☀️ --°</div>
        <div class="weather-item" id="w-bcn">BCN ☀️ --°</div>
    </div>

    <div class="city-hero" style="background-image: url('https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?q=80&w=800&auto=format&fit=crop');">
        <h2>Lisbon</h2>
    </div>
    <div class="card">
        <div class="activity-item"><i class="fa-solid fa-hotel"></i> Moxy Lisbon City</div>
        <div class="activity-item"><i class="fa-solid fa-mosque"></i> Ismaili Centre Tour</div>
    </div>

    <div class="city-hero" style="background-image: url('https://images.unsplash.com/photo-1559064500-47407038e2f8?q=80&w=800&auto=format&fit=crop');">
        <h2>Algarve</h2>
    </div>
    <div class="card">
        <div class="activity-item"><i class="fa-solid fa-umbrella-beach"></i> Pine Cliffs Resort</div>
    </div>

    <div class="city-hero" style="background-image: url('https://images.unsplash.com/photo-1595121655184-2826a7f8054a?q=80&w=800&auto=format&fit=crop');">
        <h2>Andalusia</h2>
    </div>
    <div class="card">
        <div class="activity-item"><i class="fa-solid fa-archway"></i> Mosque-Cathedral</div>
        <div class="activity-item"><i class="fa-solid fa-fort-awesome"></i> Alhambra Tour</div>
    </div>

    <div class="city-hero" style="background-image: url('https://images.unsplash.com/photo-1511527661048-7fe73d85e9a4?q=80&w=800&auto=format&fit=crop');">
        <h2>Barcelona</h2>
    </div>
    <div class="card">
        <div class="activity-item"><i class="fa-solid fa-bed"></i> Le Méridien Barcelona</div>
    </div>

    <div class="gallery-header">Trip Moments</div>
    <div class="gallery" id="auto-gallery">
        </div>
</div>

<script>
    const apiKey = 'ff6e4e362f0a4231841165933261005';

    async function fetchWeather(city, id) {
        try {
            const res = await fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=1`);
            const data = await res.json();
            const temp = Math.round(data.current.temp_c);
            const high = Math.round(data.forecast.forecastday[0].day.maxtemp_c);
            const low = Math.round(data.forecast.forecastday[0].day.mintemp_c);
            const cond = data.current.condition.text.toLowerCase();
            
            let emoji = "☀️";
            if(cond.includes("cloud")) emoji = "☁️";
            if(cond.includes("rain")) emoji = "🌧️";

            document.getElementById(id).innerHTML = `${city.substring(0,3).toUpperCase()} ${emoji}<br>${temp}° (H:${high}° L:${low}°)`;
        } catch (e) { }
    }

    async function loadGallery() {
        const url = `https://api.github.com/repos/rjivraj72/europe-trip-2026/contents/photos`;
        try {
            const response = await fetch(url);
            const files = await response.json();
            const gallery = document.getElementById('auto-gallery');
            
            // Show only actual images, newest first
            files.reverse().forEach(file => {
                if (file.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                    const div = document.createElement('div');
                    div.className = 'photo-card';
                    div.innerHTML = `<img src="${file.download_url}" loading="lazy">`;
                    gallery.appendChild(div);
                }
            });
        } catch (e) { console.log("Photos not found in /photos folder yet."); }
    }

    // Initialize
    fetchWeather("Lisbon", "w-lis");
    fetchWeather("Albufeira", "w-alg");
    fetchWeather("Cordoba", "w-and");
    fetchWeather("Barcelona", "w-bcn");
    loadGallery();
</script>
</body>
</html>
