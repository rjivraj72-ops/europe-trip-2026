<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jivraj Tour 2026</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --accent: #007aff; --booked: #28a745; --grey: #8e8e93; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: #f2f2f7; color: #1c1c1e; padding-bottom: 60px; }
        .container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1); }
        
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; background: #fff; position: sticky; top: 0; z-index: 100; }
        .rate-pill { color: var(--booked); font-weight: 800; font-size: 0.85rem; background: #eef9f2; padding: 6px 12px; border-radius: 20px; }

        /* ENLARGED WEATHER HUB */
        .weather-hub { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px 15px; background: #f2f2f7; }
        .w-box { background: white; padding: 15px; border-radius: 16px; text-align: center; border: 1px solid #e5e5ea; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .w-city { font-size: 0.75rem; font-weight: 800; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: block; }
        .w-temp { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; }

        /* HERO SECTIONS */
        .hero { height: 260px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 20px; color: white; position: relative; margin-top: 15px; border-radius: 20px; margin-left: 15px; margin-right: 15px; overflow: hidden; background-color: #333; }
        .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); }
        .hero h2 { position: relative; z-index: 1; margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }

        .card { padding: 20px; margin: 0 15px 30px; border-radius: 20px; background: #fff; border: 1px solid #eee; box-shadow: 0 5px 15px rgba(0,0,0,0.04); margin-top: -15px; position: relative; z-index: 2; }
        .item { display: flex; align-items: center; gap: 12px; margin: 12px 0; font-size: 1rem; font-weight: 500; }
        .item i { color: var(--accent); width: 24px; text-align: center; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="font-weight: 900; font-size: 1.1rem; letter-spacing: -0.5px;">JIVRAJ TOUR</div>
        <div id="rate" class="rate-pill">1 EUR = -- CAD</div>
    </div>

    <div class="weather-hub">
        <div class="w-box">
            <span class="w-city">Lisbon</span>
            <div id="w1" class="w-temp">☀️ --°</div>
        </div>
        <div class="w-box">
            <span class="w-city">Algarve</span>
            <div id="w2" class="w-temp">☀️ --°</div>
        </div>
        <div class="w-box">
            <span class="w-city">Cordoba</span>
            <div id="w3" class="w-temp">☀️ --°</div>
        </div>
        <div class="w-box">
            <span class="w-city">Barcelona</span>
            <div id="w4" class="w-temp">☀️ --°</div>
        </div>
    </div>

    <div class="hero" style="background-image: url('https://source.unsplash.com/1000x800/?lisbon,portugal');">
        <h2>Lisbon</h2>
    </div>
    <div class="card">
        <div class="item"><i class="fa-solid fa-hotel"></i> Moxy Lisbon City</div>
        <div class="item"><i class="fa-solid fa-mosque"></i> Ismaili Centre Tour</div>
    </div>

    <div class="hero" style="background-image: url('https://source.unsplash.com/1000x800/?algarve,cliffs');">
        <h2>The Algarve</h2>
    </div>
    <div class="card">
        <div class="item"><i class="fa-solid fa-umbrella-beach"></i> Pine Cliffs Resort</div>
    </div>

    <div class="hero" style="background-image: url('https://source.unsplash.com/1000x800/?cordoba,spain');">
        <h2>Andalusia</h2>
    </div>
    <div class="card">
        <div class="item"><i class="fa-solid fa-archway"></i> Mosque-Cathedral</div>
        <div class="item"><i class="fa-solid fa-fort-awesome"></i> Alhambra Tour</div>
    </div>

    <div class="hero" style="background-image: url('https://source.unsplash.com/1000x800/?barcelona,gaudi');">
        <h2>Barcelona</h2>
    </div>
    <div class="card">
        <div class="item"><i class="fa-solid fa-bed"></i> Le Méridien Barcelona</div>
        <div class="item"><i class="fa-solid fa-church"></i> Sagrada Família</div>
    </div>

    <div style="padding: 25px 20px 10px; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.5px;">Trip Moments</div>
    <div id="gallery" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px;"></div>
</div>

<script>
    async function updateData() {
        const key = 'ff6e4e362f0a4231841165933261005';
        
        // Live Rate
        try {
            const r = await fetch('https://open.er-api.com/v6/latest/EUR');
            const d = await r.json();
            document.getElementById('rate').innerHTML = `1 EUR = ${d.rates.CAD.toFixed(2)} CAD`;
        } catch(e) {}
        
        // Large Weather
        const cities = [['Lisbon','w1'],['Albufeira','w2'],['Cordoba','w3'],['Barcelona','w4']];
        cities.forEach(async ([c, id]) => {
            try {
                const res = await fetch(`https://api.weatherapi.com/v1/current.json?key=${key}&q=${c}`);
                const data = await res.json();
                const cond = data.current.condition.text.toLowerCase();
                let e = "☀️"; if(cond.includes("cloud")) e="☁️"; if(cond.includes("rain")) e="🌧️";
                document.getElementById(id).innerHTML = `${e} ${Math.round(data.current.temp_c)}°`;
            } catch(e) {}
        });

        // Photo Gallery
        try {
            const res = await fetch(`https://api.github.com/repos/rjivraj72/europe-trip-2026/contents/photos`);
            const files = await res.json();
            const g = document.getElementById('gallery');
            files.reverse().forEach(f => {
                if (f.name.match(/\.(jpg|jpeg|png)$/i)) {
                    const d = document.createElement('div');
                    d.style.height="180px"; d.style.borderRadius="20px"; d.style.overflow="hidden"; d.style.background="#f1f1f1";
                    d.innerHTML = `<img src="${f.download_url}" style="width:100%; height:100%; object-fit:cover;">`;
                    g.appendChild(d);
                }
            });
        } catch(e) {}
    }
    updateData();
</script>
</body>
</html>
